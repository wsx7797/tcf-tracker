name: TCF Tracker

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Paketleri yükle
        run: pip install requests beautifulsoup4

      - name: Script çalıştır
        run: python check.py
